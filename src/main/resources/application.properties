# ===================================================================
# Common Application Configurations
# ===================================================================
spring.application.name=BuyFurn

# Default Active Profile
# Can be overridden at runtime via JVM system property (-Dspring.profiles.active=prod)
# or via environment variable (SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=local

# JPA & Hibernate General Configs
spring.jpa.open-in-view=false

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html

# File upload properties
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Storage configuration type
file.storage.type=supabase

# -------------------------------------------------------------------
# JavaMailSender Configuration (Common settings)
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
management.health.mail.enabled=false

# -------------------------------------------------------------------
# Razorpay Configuration (Common settings)
# -------------------------------------------------------------------
razorpay.currency=INR