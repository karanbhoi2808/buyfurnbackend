# ===================================================================
# Production Configuration (application-prod.properties)
#
# All sensitive settings MUST be provided via environment variables.
# ===================================================================

# Server Settings
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Secure schema strategy for production (never use 'update' or 'create-drop' in prod)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ORIGINS}

# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# JavaMailSender Credentials
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=false

# Razorpay Credentials
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}